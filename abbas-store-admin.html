<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Abbas Store Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 18px;
  text-align:center;
  background:#111;
  border-bottom:2px solid #f5b301;
}

header h1{
  margin:0 0 8px;
  color:#f5b301;
  font-size:28px;
}

header p{
  margin:0;
  color:#aaa;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

h2{
  color:#f5b301;
  margin-top:0;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  color:#ddd;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  margin:0 0 10px;
  background:#1b1b1b;
  color:#fff;
  border:1px solid #444;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#f5b301;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.save{
  background:#f5b301;
  color:#000;
  width:100%;
  margin-top:8px;
}

.edit{
  background:#333;
  color:#fff;
}

.delete{
  background:#d33;
  color:#fff;
}

.cancel{
  background:#555;
  color:#fff;
  width:100%;
  margin-top:8px;
}

.status{
  min-height:20px;
  margin:12px 0 0;
  color:#aaa;
}

.product{
  border:1px solid #333;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.product img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#222;
  flex-shrink:0;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#f5b301;
  font-weight:bold;
  margin-bottom:7px;
}

.description{
  color:#ccc;
  white-space:pre-wrap;
  line-height:1.5;
  word-break:break-word;
}

.muted{
  color:#888;
}

.product-id{
  display:block;
  margin-top:8px;
  color:#777;
  font-size:12px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px;
}

@media(max-width:600px){

  .product{
    flex-wrap:wrap;
  }

  .product img{
    width:70px;
    height:70px;
  }

  .info{
    width:calc(100% - 85px);
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Abbas Store</h1>
  <p>Admin Dashboard</p>
</header>

<main>

<!-- ADD / EDIT PRODUCT -->

<div class="card">

  <h2 id="title">➕ Add Product</h2>

  <label>Product ID</label>
  <input
    id="id"
    type="text"
    placeholder="Example: leather-wallet"
  >

  <label>Product Name</label>
  <input
    id="name"
    type="text"
    placeholder="Example: Premium Leather Wallet"
  >

  <label>Price</label>
  <input
    id="price"
    type="number"
    min="0"
    placeholder="Price in Rs."
  >

  <label>Image URL</label>
  <input
    id="image"
    type="url"
    placeholder="https://example.com/image.jpg"
  >

  <label>Full Product Description</label>
  <textarea
    id="description"
    placeholder="Write the complete product description here..."
  ></textarea>

  <button
    class="save"
    id="save"
  >
    💾 Save Product
  </button>

  <button
    class="cancel"
    id="cancel"
    style="display:none"
  >
    Cancel Edit
  </button>

  <p
    id="status"
    class="status"
  ></p>

</div>


<!-- PRODUCTS -->

<div class="card">

  <h2>📦 All Products</h2>

  <div id="products">
    Loading...
  </div>

</div>

</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBVQH_n3bbKqSFiZeyzmPC8_cqAzqnOzY0",

  authDomain:
    "abbas-store.firebaseapp.com",

  databaseURL:
    "https://abbas-store-default-rtdb.firebaseio.com",

  projectId:
    "abbas-store",

  storageBucket:
    "abbas-store.firebasestorage.app",

  messagingSenderId:
    "750637556641",

  appId:
    "1:750637556641:web:b78ea90d4ee55fe0d521e0",

  measurementId:
    "G-7SL6JRPRYT"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let editing = null;


/* =========================
   HELPER
========================= */

const $ = id =>
  document.getElementById(id);


function status(message){

  $("status").textContent = message;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

  $("products").textContent =
    "Loading...";

  try{

    const snapshot =
      await get(
        ref(db,"products")
      );


    if(!snapshot.exists()){

      $("products").innerHTML =
        '<div class="empty">📦 No products yet.</div>';

      return;
    }


    const products =
      snapshot.val();


    $("products").innerHTML = "";


    Object.entries(products)
      .forEach(([id,p]) => {


        const div =
          document.createElement("div");

        div.className =
          "product";


        /* IMAGE */

        const img =
          document.createElement("img");

        img.src =
          p.Image || "";

        img.alt =
          p.name || "Product";

        img.onerror = function(){

          this.style.display =
            "none";

        };


        /* INFO */

        const info =
          document.createElement("div");

        info.className =
          "info";


        const name =
          document.createElement("div");

        name.className =
          "name";

        name.textContent =
          p.name || "Unnamed Product";


        const price =
          document.createElement("div");

        price.className =
          "price";

        price.textContent =
          "Rs. " +
          Number(
            p.Price || 0
          ).toLocaleString();


        const description =
          document.createElement("div");

        description.className =
          "description";

        description.textContent =
          p.description ||
          "No description added.";


        const productId =
          document.createElement("small");

        productId.className =
          "product-id";

        productId.textContent =
          "ID: " + id;


        info.appendChild(name);

        info.appendChild(price);

        info.appendChild(description);

        info.appendChild(productId);


        /* ACTIONS */

        const actions =
          document.createElement("div");

        actions.className =
          "actions";


        const editButton =
          document.createElement("button");

        editButton.className =
          "edit";

        editButton.textContent =
          "✏️ Edit";


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete";

        deleteButton.textContent =
          "🗑️ Delete";


        editButton.onclick =
          () => edit(id,p);


        deleteButton.onclick =
          () => removeProduct(id);


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );


        div.appendChild(img);

        div.appendChild(info);

        div.appendChild(actions);


        $("products")
          .appendChild(div);

      });


  }catch(error){

    $("products").textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function edit(id,p){

  editing = id;


  $("id").value =
    id;

  $("id").disabled =
    true;


  $("name").value =
    p.name || "";


  $("price").value =
    p.Price || "";


  $("image").value =
    p.Image || "";


  $("description").value =
    p.description || "";


  $("title").textContent =
    "✏️ Edit Product";


  $("save").textContent =
    "💾 Update Product";


  $("cancel").style.display =
    "block";


  status(
    "Editing: " + id
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   RESET FORM
========================= */

function reset(){

  editing = null;


  $("id").disabled =
    false;


  $("id").value =
    "";

  $("name").value =
    "";

  $("price").value =
    "";

  $("image").value =
    "";

  $("description").value =
    "";


  $("title").textContent =
    "➕ Add Product";


  $("save").textContent =
    "💾 Save Product";


  $("cancel").style.display =
    "none";


  status("");

}


$("cancel").onclick =
  reset;


/* =========================
   SAVE PRODUCT
========================= */

$("save").onclick =
  async function(){


    const id =
      $("id").value.trim();


    const name =
      $("name").value.trim();


    const price =
      Number(
        $("price").value
      );


    const image =
      $("image").value.trim();


    const description =
      $("description").value.trim();


    /* VALIDATION */

    if(!id){

      status(
        "❌ Please enter Product ID."
      );

      return;
    }


    if(!name){

      status(
        "❌ Please enter Product Name."
      );

      return;
    }


    if(
      $("price").value === "" ||
      isNaN(price)
    ){

      status(
        "❌ Please enter a valid price."
      );

      return;
    }


    try{

      status(
        "Saving..."
      );


      await set(
        ref(
          db,
          "products/" + id
        ),
        {

          name:
            name,

          Price:
            price,

          Image:
            image,

          description:
            description

        }
      );


      status(
        "✅ Product saved successfully!"
      );


      reset();


      await load();


    }catch(error){

      status(
        "❌ " +
        error.message
      );

    }

  };


/* =========================
   DELETE PRODUCT
========================= */

async function removeProduct(id){

  const confirmDelete =
    confirm(
      "Are you sure you want to delete " +
      id +
      "?"
    );


  if(!confirmDelete){

    return;

  }


  try{

    status(
      "Deleting..."
    );


    await remove(
      ref(
        db,
        "products/" + id
      )
    );


    status(
      "🗑️ Product deleted successfully!"
    );


    await load();


  }catch(error){

    status(
      "❌ " +
      error.message
    );

  }

}


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
